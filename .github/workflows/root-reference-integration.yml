name: ROOT reference exporter integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pyroot-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" ROOT
      - name: Confirm ROOT runtime
        run: python -c "import ROOT; print(ROOT.gROOT.GetVersion())"
      - name: Exercise independent ROOT exporter on synthetic data
        run: pytest -q tests/test_reference_exporter.py
