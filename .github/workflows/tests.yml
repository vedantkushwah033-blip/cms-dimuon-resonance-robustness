name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m compileall -q scripts src tests
      - run: ruff check src tests scripts/export_reference_dimuon_histogram.py scripts/audit_baseline_metadata.py scripts/inspect_root_schema.py scripts/reproduce_dimuon_spectrum.py
