name: research-level CMS schema and bounded baseline audit

# This is a deliberately manual, data-download workflow. Each selected ROOT file
# can be >1 GiB; do not redownload it on every documentation or code push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-audit:
    name: Inspect one official Run2012B/C ROOT file each
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install schema inspection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[remote]" cernopendata-client ROOT
      - name: Download one official ROOT file per record with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/research_level_schema
          printf "record_id\tfilename\tbytes\tsha256\n" > outputs/research_level_schema/manifest.tsv
          overall_status=0
          for record_id in 31123 31129; do
            cernopendata-client download-files \
              --recid "$record_id" \
              --filter-regexp '\.root$' \
              --filter-range 1-1 \
              --server https://opendata.cern.ch \
              --verify
            input_file="$(find "$record_id" -type f -name '*.root' -print -quit)"
            test -n "$input_file"
            python scripts/inspect_root_schema.py \
              --input "$input_file" \
              --output "outputs/research_level_schema/schema_$record_id.json"
            bytes="$(stat -c '%s' "$input_file")"
            sha256="$(sha256sum "$input_file" | awk '{print $1}')"
            printf "%s\t%s\t%s\t%s\n" "$record_id" "$input_file" "$bytes" "$sha256" \
              >> outputs/research_level_schema/manifest.tsv
            # Bounded candidate reconstruction. This is not a trigger-aware analysis.
            python scripts/reproduce_dimuon_spectrum.py \
              --input "$input_file" \
              --max-events 100000 \
              --step-size 10000 \
              --bins 30000 \
              --output-dir "outputs/research_level_schema/baseline_$record_id" \
              > "outputs/research_level_schema/baseline_stdout_$record_id.json"
            # Independently reconstruct the same event prefix using ROOT/RDataFrame.
            python scripts/export_reference_dimuon_histogram.py \
              --input "$input_file" \
              --max-events 100000 \
              --bins 30000 \
              --output-dir "outputs/research_level_schema/reference_$record_id" \
              > "outputs/research_level_schema/reference_stdout_$record_id.json"
            # Preserve discrepancies as machine-readable artifacts even when parity fails.
            set +e
            python scripts/compare_histograms.py \
              --reference "outputs/research_level_schema/reference_$record_id/dimuon_mass_histogram.csv" \
              --candidate "outputs/research_level_schema/baseline_$record_id/dimuon_mass_histogram.csv" \
              --output "outputs/research_level_schema/comparison_$record_id.json" \
              > "outputs/research_level_schema/comparison_stdout_$record_id.json"
            compare_status=$?
            set -e
            printf "%s\n" "$compare_status" > "outputs/research_level_schema/comparison_exit_status_$record_id.txt"
            if (( compare_status != 0 )); then
              echo "Reference parity failed for record $record_id; discrepancy report preserved in artifacts." >&2
              overall_status=1
            fi
            # Independently compare event cut flow and common histogram settings.
            set +e
            python scripts/compare_baseline_metadata.py \
              --candidate "outputs/research_level_schema/baseline_$record_id/run_metadata.json" \
              --reference "outputs/research_level_schema/reference_$record_id/reference_metadata.json" \
              --output "outputs/research_level_schema/metadata_comparison_$record_id.json" \
              > "outputs/research_level_schema/metadata_comparison_stdout_$record_id.json"
            metadata_status=$?
            set -e
            printf "%s\n" "$metadata_status" > "outputs/research_level_schema/metadata_comparison_exit_status_$record_id.txt"
            if (( metadata_status != 0 )); then
              echo "Cut-flow/configuration comparison failed for record $record_id; report preserved in artifacts." >&2
              overall_status=1
            fi
          done
          exit "$overall_status"
      - name: Upload schema reports and file manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-level-schema-audit
          path: outputs/research_level_schema/
          if-no-files-found: warn
          retention-days: 14
