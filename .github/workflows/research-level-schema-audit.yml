name: research-level CMS ROOT schema audit

on:
  push:
    branches:
      - research-plan/initial-protocol
    paths:
      - .github/workflows/research-level-schema-audit.yml
      - scripts/inspect_root_schema.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-audit:
    name: Inspect one official Run2012B/C ROOT file each
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install schema inspection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[remote]" cernopendata-client
      - name: Select a bounded-size ROOT file, download, and inspect schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/research_level_schema
          printf "record_id\tfilename\tbytes\tsha256\n" > outputs/research_level_schema/manifest.tsv
          for record_id in 31123 31129; do
            # List metadata first: the first ROOT file may be >1 GiB.
            cernopendata-client get-file-locations \
              --recid "$record_id" \
              --server https://opendata.cern.ch \
              --verbose > "outputs/research_level_schema/locations_$record_id.txt"
            selected="$(awk '$1 ~ /\.root$/ && $2 ~ /^[0-9]+$/ && $2 <= 524288000 {print $0}' \
              "outputs/research_level_schema/locations_$record_id.txt" | sort -n -k2,2 | head -n 1)"
            if [[ -z "$selected" ]]; then
              echo "No ROOT file <=500 MiB listed for record $record_id; refusing unbounded download." >&2
              exit 1
            fi
            url="$(awk '{print $1}' <<< "$selected")"
            filename="${url##*/}"
            expected_bytes="$(awk '{print $2}' <<< "$selected")"
            expected_checksum="$(awk '{print $3}' <<< "$selected")"
            printf "record_id\tfilename\tbytes\tcern_checksum\n%s\t%s\t%s\t%s\n" "$record_id" "$filename" "$expected_bytes" "$expected_checksum" \\
              > "outputs/research_level_schema/selected_$record_id.tsv"
            cernopendata-client download-files \
              --recid "$record_id" \
              --filter-name "$filename" \
              --server https://opendata.cern.ch \
              --verify
            input_file="$(find "$record_id" -type f -name "$filename" -print -quit)"
            test -n "$input_file"
            actual_bytes="$(stat -c '%s' "$input_file")"
            test "$actual_bytes" = "$expected_bytes"
            python scripts/inspect_root_schema.py \
              --input "$input_file" \
              --output "outputs/research_level_schema/schema_$record_id.json"
            sha256="$(sha256sum "$input_file" | awk '{print $1}')"
            printf "%s\t%s\t%s\t%s\n" "$record_id" "$input_file" "$actual_bytes" "$sha256" \
              >> outputs/research_level_schema/manifest.tsv
          done
      - name: Upload schema reports and file manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-level-schema-audit
          path: outputs/research_level_schema/
          if-no-files-found: warn
          retention-days: 14
